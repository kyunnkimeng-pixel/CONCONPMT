[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
deny = [
  { name = "gifski" },
  { name = "gifsicle" },
  { name = "libimagequant" },
  { name = "imagequant" },
  { name = "pngquant" },
  { name = "ffmpeg" },
]
